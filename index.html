<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1e2118" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AVGO · 日线关键价位</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="./fallback-data.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="mast">
      <div class="mast-l">
        <div class="kicker">TAPE · LEVELS</div>
        <h1 id="title">AVGO</h1>
      </div>
      <div class="mast-c" id="asof">—</div>
      <div class="mast-r">
        <span class="stamp">REC</span>
        <span class="disc">描述性 · 非建议</span>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="视图">
      <button type="button" class="tab on" data-view="observe">观察</button>
      <button type="button" class="tab" data-view="levels">点位</button>
      <button type="button" class="tab" data-view="hold">触及</button>
      <button type="button" class="tab" data-view="break">突破</button>
    </nav>

    <section class="view on" id="view-observe" aria-label="观察">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" id="presetToggles" role="group" aria-label="筛选">
              <button type="button" class="tog" data-preset="all">全部</button>
              <button type="button" class="tog on" data-preset="priority">优先</button>
              <button type="button" class="tog" data-preset="near5">±5%</button>
              <span class="sep"></span>
              <button type="button" class="tog on res" data-kind="resistance">压力</button>
              <button type="button" class="tog on sup" data-kind="support">支撑</button>
              <button type="button" class="tog on anc" data-kind="anchor">锚点</button>
              <span class="sep"></span>
              <button type="button" class="tog on" data-vrvp="1" id="btnVrvp" title="价值区 / 成交量剖面">VRVP</button>
            </div>
            <button type="button" class="tog ghost" id="btnFit">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chart" role="img" aria-label="AVGO 日K与关键价位"></div>
            <canvas id="vrvpOverlay" aria-hidden="true"></canvas>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossBar">—</div>
            <div class="legend" id="levelLegend"></div>
          </div>
        </div>
        <aside class="rail" aria-label="准确率">
          <div class="rail-h">准确率 <span id="accWindow" class="rail-sub"></span></div>
          <div class="rail-sec">
            <div class="sec-l">触及守住</div>
            <div id="obsHoldKpi" class="kpi-strip"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">命中靠前</div>
            <div id="obsTopFamilies"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">突破收益</div>
            <div id="obsBreakKpi" class="kpi-grid"></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="view" id="view-levels" hidden>
      <div class="viz-shell">
        <div class="viz-row">
          <div class="viz-pane grow">
            <div class="block-h tight">价位阶梯</div>
            <div id="levelsLadder" class="ladder"></div>
          </div>
          <div class="viz-pane profile-pane">
            <div class="block-h tight">VRVP 分层</div>
            <canvas id="levelsProfile" width="160" height="420"></canvas>
            <div class="profile-meta" id="levelsProfileMeta"></div>
          </div>
        </div>
        <div class="viz-row bands-row">
          <div class="viz-pane grow">
            <div class="block-h tight">关键带</div>
            <div id="bandsViz" class="bands-viz"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-hold" hidden>
      <div class="viz-shell">
        <div class="kpi-strip wide" id="holdKpi"></div>
        <div class="viz-row split">
          <div class="viz-pane grow">
            <div class="block-h tight">分族守住率</div>
            <div id="holdChart" class="hbar-chart"></div>
          </div>
          <div class="viz-pane side">
            <div class="block-h tight">定义</div>
            <p class="def tight" id="holdDef"></p>
            <div id="holdSideSplit" class="side-split"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-break" hidden>
      <div class="viz-shell">
        <div class="block-h tight">突破后收益分布</div>
        <div id="breakHorizon" class="horizon-grid"></div>
        <div class="viz-row split">
          <div class="viz-pane grow">
            <div class="block-h tight">分族 +5d 中位 · 四分位</div>
            <div id="breakChart" class="forest-chart"></div>
          </div>
          <div class="viz-pane side">
            <div class="block-h tight">定义</div>
            <p class="def tight" id="breakDef"></p>
            <div id="breakKpi" class="kpi-grid compact"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
