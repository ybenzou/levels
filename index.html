<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0c0e09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Levels · AVGO</title>
  <link rel="stylesheet" href="./styles.css?v=20261030160000" />
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="mast">
      <div class="mast-l">
        <div class="kicker">LEVELS</div>
        <div class="title-row">
          <h1 id="title">AVGO</h1>
          <div class="ticker-switch" id="tickerSwitch" role="group" aria-label="标的">
            <button type="button" class="tick on" data-symbol="AVGO" title="Broadcom">AVGO</button>
            <button type="button" class="tick" data-symbol="SKHY" title="SK hynix（美股）">SKHY</button>
            <button type="button" class="tick" data-symbol="CRWV" title="CoreWeave">CRWV</button>
          </div>
        </div>
      </div>
      <div class="mast-c" id="asof">—</div>
      <div class="mast-r">
        <span class="stamp">REC</span>
        <span class="disc">模型参考 · 非投资建议</span>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="视图">
      <button type="button" class="tab on" data-view="signal">信号</button>
      <button type="button" class="tab" data-view="observe">观察</button>
      <button type="button" class="tab" data-view="levels">点位</button>
      <button type="button" class="tab" data-view="hold">触及</button>
      <button type="button" class="tab" data-view="break">突破</button>
      <button type="button" class="tab" data-view="playback">回测</button>
    </nav>

    <section class="view on" id="view-signal" aria-label="信号">
      <div class="obs sig">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" role="group" aria-label="风险偏好">
              <span class="tool-l">风险偏好</span>
              <button type="button" class="tog" data-profile="conservative" title="每只股票年化波动预算 6%">保守</button>
              <button type="button" class="tog on" data-profile="balanced" title="每只股票年化波动预算 10%">平衡</button>
              <button type="button" class="tog" data-profile="aggressive" title="每只股票年化波动预算 15%">积极</button>
              <span class="sep"></span>
              <button type="button" class="tog on" data-curve="constant" title="与模型同等平均仓位、从不调仓">同仓固定</button>
              <button type="button" class="tog on" data-curve="buy_hold" title="100% 满仓一直持有">满仓持有</button>
            </div>
            <button type="button" class="tog ghost" id="btnFitSig">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chartSig" role="img" aria-label="资金曲线：风险预算仓位与持有对比"></div>
          </div>
          <div class="sig-metrics" id="sigMetrics"></div>
          <div class="chart-foot">
            <div class="ohlc" id="crossSig">资金曲线 · 对数坐标</div>
            <div class="legend tight" id="sigLegend">
              <span class="lg"><span class="sw anc-solid"></span>风险预算仓位</span>
              <span class="lg"><span class="sw cream"></span>同仓固定</span>
              <span class="lg"><span class="sw sup"></span>满仓持有</span>
              <span class="lg"><span class="sw va"></span>仓位</span>
            </div>
          </div>
        </div>
        <aside class="rail" aria-label="今日信号">
          <div class="rail-h">今日信号 <span id="sigDate" class="rail-sub"></span></div>
          <div id="sigWarn"></div>
          <div class="rail-sec">
            <div class="sec-l">建议仓位</div>
            <div id="sigSize"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">资金换算</div>
            <div id="sigCash"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">加仓时机 <span class="weak">弱信号</span></div>
            <div id="sigTiming"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">状态与风控</div>
            <div id="sigRisk"></div>
          </div>
          <div class="rail-sec" id="sigProxySec" hidden>
            <div class="sec-l">母股参考</div>
            <div id="sigProxy"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">模型体检</div>
            <div id="sigCheck"></div>
          </div>
          <p class="def tight rail-def" id="sigDef"></p>
        </aside>
      </div>
    </section>

    <section class="view" id="view-observe" hidden aria-label="观察">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" id="presetToggles" role="group" aria-label="筛选">
              <button type="button" class="tog" data-preset="all">全部</button>
              <button type="button" class="tog on" data-preset="priority">优先</button>
              <button type="button" class="tog" data-preset="near5">±5%</button>
              <span class="sep"></span>
              <button type="button" class="tog on res" data-kind="resistance">压力</button>
              <button type="button" class="tog on sup" data-kind="support">支撑</button>
              <button type="button" class="tog on anc" data-kind="anchor">锚点</button>
              <span class="sep"></span>
              <button type="button" class="tog on" data-vrvp="1" id="btnVrvp" title="价值区 / 成交量剖面">VRVP</button>
            </div>
            <button type="button" class="tog ghost" id="btnFit">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chart" role="img" aria-label="日K与关键价位"></div>
            <canvas id="vrvpOverlay" aria-hidden="true"></canvas>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossBar">—</div>
            <div class="legend" id="levelLegend"></div>
          </div>
        </div>
        <aside class="rail" aria-label="准确率">
          <div class="rail-h">准确率 <span id="accWindow" class="rail-sub"></span></div>
          <div class="rail-sec">
            <div class="sec-l">触及守住</div>
            <div id="obsHoldKpi" class="kpi-strip"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">命中靠前</div>
            <div id="obsTopFamilies"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">突破收益</div>
            <div id="obsBreakKpi" class="kpi-grid"></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="view" id="view-levels" hidden aria-label="点位">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" role="group" aria-label="点位筛选">
              <button type="button" class="tog" data-lv-preset="all">全部</button>
              <button type="button" class="tog on" data-lv-preset="priority">优先</button>
              <button type="button" class="tog" data-lv-preset="near5">±5%</button>
              <span class="sep"></span>
              <button type="button" class="tog on res" data-lv-kind="resistance">压力</button>
              <button type="button" class="tog on sup" data-lv-kind="support">支撑</button>
              <button type="button" class="tog on anc" data-lv-kind="anchor">锚点</button>
            </div>
            <button type="button" class="tog ghost" id="btnFitLevels">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chartLevels" role="img" aria-label="点位叠K线"></div>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossLevels">十字线 · OHLC</div>
            <div class="legend" id="levelsLegend"></div>
          </div>
        </div>
        <aside class="rail" aria-label="价位">
          <div class="rail-h">价位阶梯</div>
          <div id="levelsLadder" class="ladder compact"></div>
        </aside>
      </div>
    </section>

    <section class="view" id="view-hold" hidden aria-label="触及">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" role="group" aria-label="触及筛选">
              <button type="button" class="tog on" data-hold-side="all">全部</button>
              <button type="button" class="tog sup" data-hold-side="support">支撑</button>
              <button type="button" class="tog res" data-hold-side="resistance">压力</button>
              <span class="sep"></span>
              <button type="button" class="tog on" data-hold-out="all">全结果</button>
              <button type="button" class="tog" data-hold-out="held">守住</button>
              <button type="button" class="tog" data-hold-out="broken">跌破</button>
            </div>
            <button type="button" class="tog ghost" id="btnFitHold">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chartHold" role="img" aria-label="触及事件叠K线"></div>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossHold">标记 · 触及事件</div>
            <div class="legend tight" id="holdLegend">
              <span class="lg"><span class="sw sup"></span>守住</span>
              <span class="lg"><span class="sw res"></span>跌破</span>
            </div>
          </div>
        </div>
        <aside class="rail" aria-label="触及回测">
          <div class="rail-h">触及守住 <span id="holdWin" class="rail-sub"></span></div>
          <div class="kpi-strip" id="holdKpi"></div>
          <div class="rail-sec grow">
            <div class="sec-l">分族</div>
            <div id="holdChart" class="fam-list"></div>
          </div>
          <p class="def tight rail-def" id="holdDef"></p>
        </aside>
      </div>
    </section>

    <section class="view" id="view-break" hidden aria-label="突破">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" role="group" aria-label="突破筛选">
              <button type="button" class="tog on" data-brk-dir="all">全部</button>
              <button type="button" class="tog" data-brk-dir="up">↑向上</button>
              <button type="button" class="tog" data-brk-dir="down">↓向下</button>
            </div>
            <button type="button" class="tog ghost" id="btnFitBreak">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chartBreak" role="img" aria-label="突破事件叠K线"></div>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossBreak">标记 · 突破事件</div>
            <div class="legend tight" id="breakLegend">
              <span class="lg"><span class="sw anc"></span>↑突破</span>
              <span class="lg"><span class="sw res"></span>↓跌破</span>
            </div>
          </div>
        </div>
        <aside class="rail" aria-label="突破回测">
          <div class="rail-h">突破收益 <span id="breakWin" class="rail-sub"></span></div>
          <div id="breakHorizon" class="horizon-grid compact"></div>
          <div class="rail-sec grow">
            <div class="sec-l">分族 +5d 超额</div>
            <div id="breakChart" class="fam-list"></div>
          </div>
          <p class="def tight rail-def" id="breakDef"></p>
        </aside>
      </div>
    </section>

    <section class="view" id="view-playback" hidden aria-label="回测">
      <div class="obs">
        <div class="chart-pane">
          <div class="tool">
            <div class="toggles" role="group" aria-label="回测图层">
              <button type="button" class="tog on" data-play-layer="hold">触及</button>
              <button type="button" class="tog on" data-play-layer="break">突破</button>
              <span class="sep"></span>
              <button type="button" class="tog on" data-play-speed="1">1×</button>
              <button type="button" class="tog" data-play-speed="2">2×</button>
              <button type="button" class="tog" data-play-speed="4">4×</button>
            </div>
            <button type="button" class="tog ghost" id="btnFitPlay">适配</button>
          </div>
          <div class="chart-stack">
            <div id="chartPlay" role="img" aria-label="回测播放K线"></div>
          </div>
          <div class="deck" aria-label="回测走带">
            <button type="button" class="deck-btn" id="btnPlayStart" title="回到首日">|&lt;</button>
            <button type="button" class="deck-btn" id="btnPlayPrev" title="上一日">&lt;&lt;</button>
            <button type="button" class="deck-btn play" id="btnPlayToggle" title="播放/暂停" aria-pressed="false">&#9654;</button>
            <button type="button" class="deck-btn" id="btnPlayNext" title="下一日">&gt;&gt;</button>
            <button type="button" class="deck-btn" id="btnPlayEnd" title="跳到末日">&gt;|</button>
            <div class="deck-scrub">
              <input type="range" id="playScrub" min="0" max="0" value="0" step="1" aria-label="拖动日期" />
              <div class="deck-track-marks" aria-hidden="true"></div>
            </div>
            <div class="deck-meta">
              <div class="deck-date" id="playDate">—</div>
              <div class="deck-prog" id="playProg">0 / 0</div>
            </div>
          </div>
          <div class="chart-foot">
            <div class="ohlc" id="crossPlay">走带 · OHLC</div>
            <div class="legend tight" id="playLegend">
              <span class="lg"><span class="sw sup"></span>触及✓</span>
              <span class="lg"><span class="sw res"></span>触及✗</span>
              <span class="lg"><span class="sw anc"></span>↑突破</span>
              <span class="lg"><span class="sw res"></span>↓跌破</span>
            </div>
          </div>
        </div>
        <aside class="rail" aria-label="滚动回测">
          <div class="rail-h">滚动回测 <span id="playWin" class="rail-sub"></span></div>
          <div class="rail-sec">
            <div class="sec-l">累计触及</div>
            <div id="playHoldKpi" class="kpi-strip"></div>
          </div>
          <div class="rail-sec">
            <div class="sec-l">累计突破 +5d</div>
            <div id="playBreakKpi" class="kpi-grid"></div>
          </div>
          <div class="rail-sec grow">
            <div class="sec-l">当日事件</div>
            <div id="playDayFeed" class="day-feed"></div>
          </div>
        </aside>
      </div>
    </section>

  </div>
  <script src="./app.js?v=20261030160000"></script>
</body>
</html>
